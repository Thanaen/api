version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: monthly
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      github-actions:
        patterns:
          - "*"
